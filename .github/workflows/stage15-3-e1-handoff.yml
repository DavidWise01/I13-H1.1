name: Stage 15.3 E1 live handoff

on:
  push:
    paths:
      - 'docs/workbench.html'
      - 'docs/e1-service.html'
      - 'docs/e1-tech-001.js'
      - 'docs/stages/stage15-3-e1-handoff.js'
      - 'docs/STAGE15.3-E1-HANDOFF.md'
      - 'docs/E1-TECH-001.md'
      - 'src/e1_boundary.rs'
      - 'src/lib.rs'
      - '.github/workflows/stage15-3-e1-handoff.yml'
  pull_request:
    paths:
      - 'docs/workbench.html'
      - 'docs/e1-service.html'
      - 'docs/e1-tech-001.js'
      - 'docs/stages/stage15-3-e1-handoff.js'
      - 'docs/STAGE15.3-E1-HANDOFF.md'
      - 'docs/E1-TECH-001.md'
      - 'src/e1_boundary.rs'
      - 'src/lib.rs'
      - '.github/workflows/stage15-3-e1-handoff.yml'

permissions:
  contents: read
  statuses: write

jobs:
  e1-handoff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish pending handoff status
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'pending',context:'i13/e1-handoff',description:'Stage 15.3 E1 handoff proof running'})
      - name: Check internal handoff and TECH JavaScript syntax
        run: |
          node --check docs/stages/stage15-3-e1-handoff.js
          node --check docs/e1-tech-001.js
      - name: Extract and check sandbox service JavaScript
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/e1-service.html').read_text()
          js = text.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/e1-service.js').write_text(js)
          PY
          node --check /tmp/e1-service.js
      - name: Enforce opaque sandbox and message-only service
        run: |
          grep -q "setAttribute('sandbox', 'allow-scripts')" docs/stages/stage15-3-e1-handoff.js
          ! grep -q "allow-same-origin" docs/e1-service.html
          ! grep -Eq 'fetch\(|localStorage|sessionStorage|indexedDB' docs/e1-service.html
          grep -q 'postMessage' docs/e1-service.html
          grep -q 'postMessage' docs/stages/stage15-3-e1-handoff.js
      - name: Check workbench wiring, Wasm gates, and TECH trits
        run: |
          grep -q 'stages/stage15-3-e1-handoff.js' docs/workbench.html
          grep -q 'i13_e1_boundary_verify' docs/stages/stage15-3-e1-handoff.js
          grep -q 'i13_e1_closed_loop_verify' docs/stages/stage15-3-e1-handoff.js
          grep -q 'pub extern "C" fn i13_e1_boundary_verify' src/lib.rs
          grep -q 'pub extern "C" fn i13_e1_closed_loop_verify' src/lib.rs
          grep -q 'E1.TECH-001' docs/stages/stage15-3-e1-handoff.js
          grep -q "'TECH-001'" docs/e1-service.html
          grep -q 'n1' docs/e1-tech-001.js
          grep -q 'p0' docs/e1-tech-001.js
          grep -q 'p1' docs/e1-tech-001.js
      - name: Publish handoff result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/e1-handoff',description:ok?'Stage 15.3 E1 sandbox handoff verified':'Stage 15.3 E1 handoff proof failed'})
