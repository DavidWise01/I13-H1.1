name: I13 golden corpus Pages river

on:
  push:
    branches: [main]
    paths:
      - 'docs/corpus.html'
      - 'docs/semantics.html'
      - 'docs/relations.html'
      - 'docs/analysis.html'
      - 'docs/logic.html'
      - 'docs/keystone.html'
      - 'docs/KEYSTONE-PLATO.md'
      - 'docs/LOGIC-*.md'
      - 'docs/landing.js'
      - 'docs/CORPUS-*.md'
      - 'corpus/golden/**'
      - 'corpus/README.md'
      - '.github/workflows/corpus-*.yml'
      - '.github/workflows/keystone-plato.yml'
  pull_request:
    paths:
      - 'docs/corpus.html'
      - 'docs/semantics.html'
      - 'docs/relations.html'
      - 'docs/analysis.html'
      - 'docs/logic.html'
      - 'docs/keystone.html'
      - 'docs/KEYSTONE-PLATO.md'
      - 'docs/LOGIC-*.md'
      - 'docs/landing.js'
      - 'docs/CORPUS-*.md'
      - 'corpus/golden/**'
      - 'corpus/README.md'
      - '.github/workflows/corpus-*.yml'
      - '.github/workflows/keystone-plato.yml'

permissions:
  contents: read

jobs:
  golden-river-pages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check landing JavaScript
        run: node --check docs/landing.js
      - name: Check six-reach continuity
        run: |
          node - <<'NODE'
          const fs=require('fs');
          const a=JSON.parse(fs.readFileSync('corpus/golden/00_atoms/manifest.json','utf8'));
          const s=JSON.parse(fs.readFileSync('corpus/golden/01_syntax/manifest.json','utf8'));
          const m=JSON.parse(fs.readFileSync('corpus/golden/02_semantics/manifest.json','utf8'));
          const r=JSON.parse(fs.readFileSync('corpus/golden/03_relations/manifest.json','utf8'));
          const n=JSON.parse(fs.readFileSync('corpus/golden/04_analysis/manifest.json','utf8'));
          const l=JSON.parse(fs.readFileSync('corpus/golden/05_logic/manifest.json','utf8'));
          if(a.composition.final!==s.inherits.handoff) throw new Error('atoms -> syntax discontinuity');
          if(s.composition.final!==m.inherits.handoff) throw new Error('syntax -> semantics discontinuity');
          if(m.composition.final!==r.inherits.handoff) throw new Error('semantics -> relations discontinuity');
          if(r.composition.final!==n.inherits.handoff) throw new Error('relations -> analysis discontinuity');
          if(n.composition.final!==l.inherits.handoff) throw new Error('analysis -> logic discontinuity');
          if(l.composition.final!==86267571272) throw new Error('logic final drift');
          console.log(`RIVER CONTINUITY PASS · ${a.composition.final} -> ${s.composition.final} -> ${m.composition.final} -> ${r.composition.final} -> ${n.composition.final} -> ${l.composition.final}`);
          NODE
      - name: Check River Observatory
        run: |
          test -s docs/corpus.html
          grep -Fq '54</strong><span>ROCKS' docs/corpus.html
          grep -Fq '6</strong><span>REACHES' docs/corpus.html
          grep -Fq 'CURRENT = 86267571272' docs/corpus.html
          grep -Fq '04 ANALYSIS · COMPLETE' docs/corpus.html
          grep -Fq '05 LOGIC · CANON CANDIDATE' docs/corpus.html
          grep -Fq '1134903170</strong><span>04 final' docs/corpus.html
          grep -Fq '1134903170</strong><span>05 start' docs/corpus.html
          grep -Fq '[0|-1]' docs/corpus.html
          grep -Fq 'Q = QUEEN' docs/corpus.html
      - name: Check frozen upstream observatories
        run: |
          grep -Fq 'I13 GOLDEN CORPUS · 02 SEMANTICS · FROZEN' docs/semantics.html
          grep -Fq 'I13 GOLDEN CORPUS · 03 RELATIONS · FLAY v0.1 · FROZEN' docs/relations.html
          grep -Fq 'I13 GOLDEN CORPUS · 04 ANALYSIS v0.1 · FROZEN' docs/analysis.html
          grep -Fq '1134903170' docs/analysis.html
      - name: Check Plato Keystone
        run: |
          test -s docs/keystone.html
          test -s docs/KEYSTONE-PLATO.md
          test -s corpus/golden/keystone_plato.i13
          grep -Fq 'I13 ARCHITECTURE · TOP-RIGHT KEYSTONE' docs/keystone.html
          grep -Fq 'PLATO = KEYSTONE' docs/keystone.html
          grep -Fq 'ARCHITECTURAL KEYSTONE · NON-RIVER' docs/KEYSTONE-PLATO.md
          grep -Fq 'ARISTOTLE FORK' docs/KEYSTONE-PLATO.md
      - name: Check Logic Observatory and canon
        run: |
          test -s docs/logic.html
          test -s docs/CORPUS-LOGIC.md
          test -s docs/LOGIC-GENEALOGY-FORK.md
          test -s docs/LOGIC-FIELD-QUEEN.md
          test -s corpus/golden/05_logic/logic.i13
          grep -Fq 'I13 GOLDEN CORPUS · 05 LOGIC · CANON' docs/logic.html
          grep -Fq 'Logic 0 Day' docs/logic.html
          grep -Fq '~347 BCE' docs/logic.html
          grep -Fq 'PRESERVE FORM WHILE TRAVERSING CONSEQUENCE' docs/logic.html
          grep -Fq 'Q = QUEEN' docs/logic.html
          grep -Fq '[0|-1]' docs/logic.html
          grep -Fq '86267571272' docs/logic.html
          grep -Fq 'I13-LOGIC-001' corpus/golden/05_logic/README.md
          grep -Fq 'OPPOSITION ALONE DOES NOT CREATE TRUTH.' corpus/golden/05_logic/README.md
          grep -Fq 'BOOLEAN IS DOWNSTREAM.' corpus/golden/05_logic/README.md
      - name: Check executable lenses and Logic handoff
        run: |
          grep -Fq 'I ADA_LENS_OK <-' corpus/golden/02_semantics/ada_lens.i13
          grep -Fq 'I FLAY_OPEN_VALUE <- flay_gate(FLAY_SATISFIED, 13)' corpus/golden/03_relations/flay.i13
          grep -Fq 'I ANALYSIS_OPEN_VALUE <- analysis_profile(ANALYSIS_UPSTREAM_FLAY)' corpus/golden/04_analysis/analysis.i13
          grep -Fq 'I_VALUE_MATCH <- same_value' corpus/golden/keystone_plato.i13
          grep -Fq 'I LOGIC_ZERO_BCE <- 347' corpus/golden/05_logic/logic.i13
          grep -Fq 'I LOGIC_FORM_OK <- form_survives' corpus/golden/05_logic/logic.i13
          grep -Fq 'I LOGIC_CONSEQUENCE_OK <- consequence' corpus/golden/05_logic/logic.i13
          grep -Fq 'I LOGIC_DECISION <- decision' corpus/golden/05_logic/logic.i13
          grep -Fq 'LOGIC_EVIDENCE_AFTER == LOGIC_EVIDENCE_INPUT' corpus/golden/05_logic/logic.i13
      - name: Check discovery
        run: |
          grep -Fq "link.href='semantics.html'" docs/landing.js
          grep -Fq "link.href='relations.html'" docs/landing.js
          grep -Fq "link.href='analysis.html'" docs/landing.js
          grep -Fq "link.href='logic.html'" docs/landing.js
          grep -Fq "link.href='keystone.html'" docs/landing.js
          grep -Fq 'PLATO KEYSTONE' docs/landing.js
          grep -Fq 'Fifty-four curated I13 rocks' docs/landing.js
          grep -Fq 'OPEN LOGIC' docs/landing.js
