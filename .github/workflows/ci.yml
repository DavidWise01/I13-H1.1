name: H1.1 core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test native core
        run: cargo test --all-targets
      - name: Build Wasm core
        run: cargo build --release --target wasm32-unknown-unknown

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reference dependency
        run: python -m pip install numpy
      - name: Verify frozen/reference parity
        run: python scripts/verify_reference.py

  pages-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check exploded-view JavaScript syntax
        run: node --check docs/exploded-view.js
      - name: Check Stage 3 JavaScript syntax
        run: node --check docs/stages/ivm-reader.js
      - name: Check Stage 4 JavaScript syntax
        run: node --check docs/stages/stage4-toolchain.js
      - name: Check Pages wiring
        run: |
          grep -q 'src="exploded-view.js"' docs/index.html
          grep -q 'src="stages/ivm-reader.js"' docs/index.html
          grep -q 'src="stages/stage4-toolchain.js"' docs/index.html
      - name: Check canonical IVM opcode set
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/ivm-reader.js', 'utf8');
          const match = source.match(/const OPCODES = Object\.freeze\(\[(.*?)\]\);/s);
          assert(match, 'OPCODES declaration missing');
          const ops = [...match[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          assert.deepStrictEqual(ops, ['Const','Ask','Attr','Ret','Answer','Drop','Bin','Cmp','If','Call','Block','Else','End','Func','Halt']);
          assert.strictEqual(ops.length, 15);
          assert.strictEqual(ops.includes('br'), false);
          NODE
      - name: Check Stage 3 mount contract
        run: |
          grep -q "const MODULE_ID = 'reader'" docs/stages/ivm-reader.js
          grep -q 'expanded: false' docs/stages/ivm-reader.js
          grep -q "label: 'RESET'" docs/stages/ivm-reader.js
          grep -q "label: 'STEP'" docs/stages/ivm-reader.js
          grep -q "label: 'RUN'" docs/stages/ivm-reader.js
          grep -q "label: 'AUTO'" docs/stages/ivm-reader.js
      - name: Check Stage 4 mount contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage4-toolchain.js', 'utf8');
          const idsMatch = source.match(/const MODULE_IDS = Object\.freeze\(\[(.*?)\]\);/s);
          assert(idsMatch, 'MODULE_IDS declaration missing');
          const ids = [...idsMatch[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          assert.deepStrictEqual(ids, ['norm','python','wasm1','wasm2']);
          const opMatch = source.match(/const CANONICAL_OPCODES = Object\.freeze\(\[(.*?)\]\);/s);
          assert(opMatch, 'CANONICAL_OPCODES declaration missing');
          const ops = [...opMatch[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          assert.deepStrictEqual(ops, ['Const','Ask','Attr','Ret','Answer','Drop','Bin','Cmp','If','Call','Block','Else','End','Func','Halt']);
          assert.strictEqual(ops.includes('br'), false);
          assert(source.includes("label: 'PY ENGINE'"));
          assert(source.includes("label: 'WASM SELFTEST'"));
          assert(source.includes("label: 'RECEIPT'"));
          assert(source.includes("label: 'CHECK'"));
          NODE
      - name: Keep deeper stages unmounted
        run: |
          test "$(grep -o 'src="stages/' docs/index.html | wc -l)" -eq 2
          ! grep -q 'I13Exploded.mount.(.jit' docs/stages/stage4-toolchain.js
          ! grep -q 'I13Exploded.mount.(.gfx' docs/stages/stage4-toolchain.js
          ! grep -q 'I13Exploded.mount.(.ology' docs/stages/stage4-toolchain.js
