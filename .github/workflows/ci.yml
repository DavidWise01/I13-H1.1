name: H1.1 core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test native core
        run: cargo test --all-targets
      - name: Build Wasm core
        run: cargo build --release --target wasm32-unknown-unknown

  reference:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install reference dependency
        run: python -m pip install numpy
      - name: Verify frozen/reference parity
        run: python scripts/verify_reference.py

  pages-component:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check exploded-view JavaScript syntax
        run: node --check docs/exploded-view.js
      - name: Check Stage 3 JavaScript syntax
        run: node --check docs/stages/ivm-reader.js
      - name: Check Stage 4 JavaScript syntax
        run: node --check docs/stages/stage4-toolchain.js
      - name: Check Stage 7 JavaScript syntax
        run: node --check docs/stages/stage7-jit-shell.js
      - name: Check Stage 8 JavaScript syntax
        run: node --check docs/stages/stage8-gfx.js
      - name: Check Stage 9 JavaScript syntax
        run: node --check docs/stages/stage9-cortex-child.js
      - name: Check Stage 10 JavaScript syntax
        run: node --check docs/stages/stage10-pulse.js
      - name: Check Stage 6 JavaScript syntax
        run: node --check docs/stages/stage6-ology-live.js

      - name: Check Pages wiring
        run: |
          grep -q 'src="exploded-view.js"' docs/index.html
          grep -q 'src="stages/ivm-reader.js"' docs/index.html
          grep -q 'src="stages/stage4-toolchain.js"' docs/index.html
          grep -q 'src="stages/stage7-jit-shell.js"' docs/index.html
          grep -q 'src="stages/stage8-gfx.js"' docs/index.html
          grep -q 'src="stages/stage9-cortex-child.js"' docs/index.html
          grep -q 'src="stages/stage10-pulse.js"' docs/index.html
          grep -q 'src="stages/stage6-ology-live.js"' docs/index.html

      - name: Check Stage 5 bounded layout contract
        run: |
          grep -q "version: '0.2.0'" docs/exploded-view.js
          grep -q 'function wrapLines' docs/exploded-view.js
          grep -q "createElementNS(SVG_NS, 'clipPath')\|el('clipPath'" docs/exploded-view.js
          grep -q 'machineExpanded: spec.machineExpanded === true' docs/exploded-view.js
          grep -q "'MACHINE +'" docs/exploded-view.js
          grep -q 'expandMachine' docs/exploded-view.js
          grep -q 'collapseMachine' docs/exploded-view.js
          grep -q 'toggleMachine' docs/exploded-view.js

      - name: Check Stage 7 JIT mount contract
        run: |
          grep -q "const MODULE_ID = 'jit'" docs/stages/stage7-jit-shell.js
          grep -q "title: 'JIT SHELL v0.2 · EXPLODED'" docs/stages/stage7-jit-shell.js
          grep -q 'expanded: false' docs/stages/stage7-jit-shell.js
          grep -q 'machineExpanded: false' docs/stages/stage7-jit-shell.js
          grep -q "label: 'RESET'" docs/stages/stage7-jit-shell.js
          grep -q "label: 'STEP'" docs/stages/stage7-jit-shell.js
          grep -q "label: 'RUN'" docs/stages/stage7-jit-shell.js
          grep -q "label: 'CACHE'" docs/stages/stage7-jit-shell.js
          grep -q "label: 'CAP ON'" docs/stages/stage7-jit-shell.js
          grep -q '7/7 PASS recorded' docs/stages/stage7-jit-shell.js

      - name: Execute Stage 7 JIT reference self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage7-jit-shell.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {} },
            console, Map, Object, Math
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13JitShell.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          const checks = Object.fromEntries(result.checks.map(c => [c.name, c.pass]));
          assert.strictEqual(checks['cold demo returns 6'], true);
          assert.strictEqual(checks['cold demo is cache miss'], true);
          assert.strictEqual(checks['warm demo is cache hit'], true);
          assert.strictEqual(checks['address deterministic'], true);
          assert.strictEqual(checks['capability denial vetoes'], true);
          NODE

      - name: Check Stage 8 GFX mount contract
        run: |
          grep -q "const MODULE_ID = 'gfx'" docs/stages/stage8-gfx.js
          grep -q "const RECORD_BYTES = 32" docs/stages/stage8-gfx.js
          grep -q "title: 'GFX TRUNK v0.3 -> v0.4.1 · EXPLODED'" docs/stages/stage8-gfx.js
          grep -q "family: 'gpu'" docs/stages/stage8-gfx.js
          grep -q 'expanded: false' docs/stages/stage8-gfx.js
          grep -q 'machineExpanded: false' docs/stages/stage8-gfx.js
          grep -q "label: 'RESET'" docs/stages/stage8-gfx.js
          grep -q "label: 'STEP CMD'" docs/stages/stage8-gfx.js
          grep -q "label: 'FRAME'" docs/stages/stage8-gfx.js
          grep -q "label: 'SELECT'" docs/stages/stage8-gfx.js
          grep -q "label: 'REPORT'" docs/stages/stage8-gfx.js
          grep -q 'stage8-gfx-output-clip' docs/stages/stage8-gfx.js
          grep -q '10188' docs/stages/stage8-gfx.js
          grep -q "nativeTests: '8/8 PASS'" docs/stages/stage8-gfx.js

      - name: Execute Stage 8 GFX reference self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage8-gfx.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {} },
            console, Map, Object, Math, JSON, Error
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13GfxStage.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          const checks = Object.fromEntries(result.checks.map(c => [c.name, c.pass]));
          assert.strictEqual(checks['canonical native builtin set'], true);
          assert.strictEqual(checks['reference command count is 7'], true);
          assert.strictEqual(checks['record width is 32 bytes'], true);
          assert.strictEqual(checks['cube report record preserved'], true);
          assert.strictEqual(checks['sphere report record preserved'], true);
          assert.strictEqual(checks['rotation report record preserved'], true);
          assert.strictEqual(checks['reference frame creates two entities'], true);
          assert.strictEqual(checks['rotation reaches cube state'], true);
          assert.strictEqual(checks['backend order preserved'], true);
          assert.strictEqual(checks['reference facts preserved'], true);
          NODE

      - name: Check Stage 9 Cortex child mount contract
        run: |
          grep -q "const MODULE_ID = 'child'" docs/stages/stage9-cortex-child.js
          grep -q "title: 'CORTEX CHILD · BOUNDED EPHEMERAL · EXPLODED'" docs/stages/stage9-cortex-child.js
          grep -q "family: 'cortex'" docs/stages/stage9-cortex-child.js
          grep -q 'expanded: false' docs/stages/stage9-cortex-child.js
          grep -q 'machineExpanded: false' docs/stages/stage9-cortex-child.js
          grep -q "label: 'RESET'" docs/stages/stage9-cortex-child.js
          grep -q "label: 'STEP'" docs/stages/stage9-cortex-child.js
          grep -q "label: 'RUN'" docs/stages/stage9-cortex-child.js
          grep -q "label: 'OBSERVE GFX'" docs/stages/stage9-cortex-child.js
          grep -q "label: 'RECEIPT'" docs/stages/stage9-cortex-child.js
          grep -q 'stage9-child-output-clip' docs/stages/stage9-cortex-child.js
          grep -q 'direct commit · FORBIDDEN' docs/stages/stage9-cortex-child.js
          grep -q '0xdeadbeef' docs/stages/stage9-cortex-child.js

      - name: Execute Stage 9 Cortex child self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage9-cortex-child.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {} },
            console, Map, Object, Math, JSON, Error
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13CortexChild.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          const checks = Object.fromEntries(result.checks.map(c => [c.name, c.pass]));
          assert.strictEqual(checks['canonical lifecycle order'], true);
          assert.strictEqual(checks['returns to zero'], true);
          assert.strictEqual(checks['private state erased'], true);
          assert.strictEqual(checks['receipt survives termination'], true);
          assert.strictEqual(checks['receipt preserves depth width witness'], true);
          assert.strictEqual(checks['private state omitted from receipt'], true);
          assert.strictEqual(checks['vh1 sample width preserved'], true);
          assert.strictEqual(checks['direct commit forbidden'], true);
          assert.strictEqual(result.receipt.childId, 13);
          assert.strictEqual(result.receipt.depth, 4);
          assert.strictEqual(result.receipt.width, 81);
          assert.strictEqual(result.receipt.witness, 42);
          assert.strictEqual(result.receipt.terminated, true);
          assert.strictEqual(JSON.stringify(result.receipt).includes('deadbeef'), false);
          NODE

      - name: Check Stage 10 Pulse mount contract
        run: |
          grep -q "const MODULE_ID = 'pulse'" docs/stages/stage10-pulse.js
          grep -q "const BOUNDARY = 128" docs/stages/stage10-pulse.js
          grep -q "title: 'PULSE · EXPERIMENTAL H1.1 THRESHOLD · EXPLODED'" docs/stages/stage10-pulse.js
          grep -q "family: 'pulse'" docs/stages/stage10-pulse.js
          grep -q 'expanded: false' docs/stages/stage10-pulse.js
          grep -q 'machineExpanded: false' docs/stages/stage10-pulse.js
          grep -q "label: 'RESET'" docs/stages/stage10-pulse.js
          grep -q "label: 'STEP'" docs/stages/stage10-pulse.js
          grep -q "label: 'RUN'" docs/stages/stage10-pulse.js
          grep -q "label: 'CASE PASS'" docs/stages/stage10-pulse.js
          grep -q "label: 'NOTATION'" docs/stages/stage10-pulse.js
          grep -q 'stage10-pulse-output-clip' docs/stages/stage10-pulse.js
          grep -q 'not frozen I-13 syntax' docs/stages/stage10-pulse.js
          grep -q 'operator >' docs/stages/stage10-pulse.js

      - name: Execute Stage 10 Pulse self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage10-pulse.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {} },
            console, Object, Math, JSON, Error
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13PulseStage.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          const checks = Object.fromEntries(result.checks.map(c => [c.name, c.pass]));
          assert.strictEqual(checks['boundary is 128'], true);
          assert.strictEqual(checks['strict operator is greater-than'], true);
          assert.strictEqual(checks['pass example adjusted is 130'], true);
          assert.strictEqual(checks['pass example returns 260'], true);
          assert.strictEqual(checks['edge example adjusted is 128'], true);
          assert.strictEqual(checks['exact boundary returns none'], true);
          assert.strictEqual(checks['helper matches pass example'], true);
          assert.strictEqual(checks['helper matches edge example'], true);
          assert.strictEqual(result.passCase.result, 260);
          assert.strictEqual(result.edgeCase.result, null);
          NODE

      - name: Check Stage 6 live observer contract
        run: |
          grep -q "version: '0.1.0'" docs/stages/stage6-ology-live.js
          grep -q "const MODULE_ID = 'ology'" docs/stages/stage6-ology-live.js
          grep -q 'LIVE LAB' docs/stages/stage6-ology-live.js
          grep -q 'LIVE · CURRENT' docs/stages/stage6-ology-live.js
          grep -q 'MutationObserver' docs/stages/stage6-ology-live.js
          grep -q 'stage6-ology-status' docs/stages/stage6-ology-live.js
          grep -q 'jumpToLab' docs/stages/stage6-ology-live.js
          grep -q 'window.I13OlogyLive' docs/stages/stage6-ology-live.js
          ! grep -Fq "I13Exploded.mount('ology'" docs/stages/stage6-ology-live.js

      - name: Check canonical IVM opcode set
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/ivm-reader.js', 'utf8');
          const match = source.match(/const OPCODES = Object\.freeze\(\[(.*?)\]\);/s);
          assert(match, 'OPCODES declaration missing');
          const ops = [...match[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          assert.deepStrictEqual(ops, ['Const','Ask','Attr','Ret','Answer','Drop','Bin','Cmp','If','Call','Block','Else','End','Func','Halt']);
          assert.strictEqual(ops.length, 15);
          assert.strictEqual(ops.includes('br'), false);
          NODE

      - name: Check Stage 3 mount contract
        run: |
          grep -q "const MODULE_ID = 'reader'" docs/stages/ivm-reader.js
          grep -q 'expanded: false' docs/stages/ivm-reader.js
          grep -q "label: 'RESET'" docs/stages/ivm-reader.js
          grep -q "label: 'STEP'" docs/stages/ivm-reader.js
          grep -q "label: 'RUN'" docs/stages/ivm-reader.js
          grep -q "label: 'AUTO'" docs/stages/ivm-reader.js

      - name: Check Stage 4 mount contract
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage4-toolchain.js', 'utf8');
          const idsMatch = source.match(/const MODULE_IDS = Object\.freeze\(\[(.*?)\]\);/s);
          assert(idsMatch, 'MODULE_IDS declaration missing');
          const ids = [...idsMatch[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          assert.deepStrictEqual(ids, ['norm','python','wasm1','wasm2']);
          const opMatch = source.match(/const CANONICAL_OPCODES = Object\.freeze\(\[(.*?)\]\);/s);
          assert(opMatch, 'CANONICAL_OPCODES declaration missing');
          const ops = [...opMatch[1].matchAll(/'([^']+)'/g)].map(m => m[1]);
          assert.deepStrictEqual(ops, ['Const','Ask','Attr','Ret','Answer','Drop','Bin','Cmp','If','Call','Block','Else','End','Func','Halt']);
          assert.strictEqual(ops.includes('br'), false);
          assert(source.includes("label: 'PY ENGINE'"));
          assert(source.includes("label: 'WASM SELFTEST'"));
          assert(source.includes("label: 'RECEIPT'"));
          assert(source.includes("label: 'CHECK'"));
          NODE

      - name: Keep later deep stages unmounted
        run: |
          test "$(grep -o 'src="stages/' docs/index.html | wc -l)" -eq 7
          ! grep -Fq "I13Exploded.mount('vh1'" docs/stages/stage10-pulse.js
          ! grep -Fq "I13Exploded.mount('vh2'" docs/stages/stage10-pulse.js
          ! grep -Fq "I13Exploded.mount('freeze'" docs/stages/stage10-pulse.js
          ! grep -Fq "I13Exploded.mount('corpus'" docs/stages/stage10-pulse.js
          ! grep -Fq "I13Exploded.mount('ology'" docs/stages/stage10-pulse.js
