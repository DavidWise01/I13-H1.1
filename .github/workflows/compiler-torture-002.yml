name: I13 compiler differential torture 002

on:
  push:
    branches: [main]
    paths:
      - 'src/compiler/**'
      - 'src/bin/i13.rs'
      - 'scripts/compiler_torture.sh'
      - 'scripts/compiler_torture_002.sh'
      - '.github/workflows/compiler-torture-002.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attack-known-good:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Attack beyond known-good boundary until first break
        run: bash scripts/compiler_torture_002.sh
