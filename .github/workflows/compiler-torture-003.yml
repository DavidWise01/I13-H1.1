    branches: [main]
    paths:
      - 'src/compiler/**'
      - 'src/bin/i13.rs'
      - 'scripts/compiler_torture.sh'
      - 'scripts/compiler_torture_002.sh'
      - 'scripts/compiler_torture_003.sh'
      - '.github/workflows/compiler-torture-003.yml'
  workflow_dispatch:

permissions:
