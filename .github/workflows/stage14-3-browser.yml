name: Stage 14.3 browser navigator

on:
  push:
    branches: [main]
    paths:
      - 'build.rs'
      - 'Cargo.toml'
      - 'src/corpus.rs'
      - 'src/corpus_walker.rs'
      - 'src/lib.rs'
      - 'corpus/h1.1-corpus.jsonl'
      - 'corpus/maps/WORLD-IV-SONIA.json'
      - 'scripts/corpus_stage14.py'
      - 'scripts/corpus_mesh_stage14_1.py'
      - 'scripts/corpus_browser_stage14_3.py'
      - 'scripts/test_corpus_browser_stage14_3.py'
      - 'docs/index.html'
      - 'docs/stages/stage14-corpus-navigator.js'
      - '.github/workflows/stage14-3-browser.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  browser-corpus:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test Stage 14.3 manifest
        run: python -m unittest scripts.test_corpus_browser_stage14_3
      - name: Generate browser manifest
        run: python scripts/corpus_browser_stage14_3.py --output docs/assets/corpus-browser.json --summary
      - name: Test Stage 14.2 walker
        run: cargo test corpus_walker::tests -- --nocapture
      - name: Build release Wasm
        run: cargo build --release --target wasm32-unknown-unknown
      - name: Publish Wasm as Pages-safe base64
        run: |
          base64 -w0 target/wasm32-unknown-unknown/release/i13_h1_1.wasm > docs/assets/i13_h1_1.wasm.b64
          printf '\n' >> docs/assets/i13_h1_1.wasm.b64
      - name: Check browser JavaScript syntax
        run: node --check docs/stages/stage14-corpus-navigator.js
      - name: Verify generated browser assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, json
          m = json.loads(Path('docs/assets/corpus-browser.json').read_text())
          raw = base64.b64decode(Path('docs/assets/i13_h1_1.wasm.b64').read_text())
          assert raw[:4] == b'\x00asm'
          assert m['counts']['nodes'] == 54
          assert m['counts']['edges'] == 187
          assert m['counts']['directed_edges'] == 374
          assert m['counts']['world_steps'] == 9
          names = [
              b'i13_corpus_node_count', b'i13_corpus_edge_count',
              b'i13_corpus_neighbor_count', b'i13_corpus_neighbor',
              b'i13_corpus_walk_next', b'i13_corpus_burrow',
              b'i13_corpus_is_evidence', b'i13_corpus_source_fingerprint'
          ]
          missing = [name.decode() for name in names if name not in raw]
          assert not missing, missing
          print(f"STAGE 14.3 ASSET PASS · wasm={len(raw)} B · nodes={m['counts']['nodes']} · edges={m['counts']['edges']}")
          PY
      - name: Execute browser Wasm traversal smoke test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const assert = require('assert');
          function fnv1a32(text) {
            let h = 0x811c9dc5 >>> 0;
            for (const byte of Buffer.from(text, 'utf8')) {
              h ^= byte;
              h = Math.imul(h, 0x01000193) >>> 0;
            }
            return h >>> 0;
          }
          (async () => {
            const bytes = Buffer.from(fs.readFileSync('docs/assets/i13_h1_1.wasm.b64', 'utf8').trim(), 'base64');
            const { instance } = await WebAssembly.instantiate(bytes, {});
            const e = instance.exports;
            assert.strictEqual(Number(e.i13_corpus_node_count()), 54);
            assert.strictEqual(Number(e.i13_corpus_edge_count()), 187);

            const start = fnv1a32('sonia-001');
            const goal = fnv1a32('fractal-007');
            let current = start;
            let hops = 0;
            while (current !== goal && hops < 54) {
              const packed = BigInt(e.i13_corpus_walk_next(current, goal, 0, 54));
              assert.notStrictEqual(packed, 0n, 'full-mesh Sonia -> Fractint walk vetoed');
              assert.notStrictEqual(packed & (1n << 63n), 0n, 'walk success bit missing');
              const next = Number(packed & 0xffff_ffffn) >>> 0;
              assert.notStrictEqual(next, current, 'walker failed to advance');
              current = next;
              hops++;
            }
            assert.strictEqual(current, goal, 'browser Wasm walker did not reach Fractint');

            const evidenceVeto = BigInt(e.i13_corpus_walk_next(fnv1a32('sonia-003'), goal, 1, 54));
            assert.strictEqual(evidenceVeto, 0n, 'Vogel goal must be excluded in evidence-only mode');

            const root = fnv1a32('sonia-003');
            const burrow = BigInt(e.i13_corpus_burrow(root, 81, 81, 1));
            assert.notStrictEqual(burrow & (1n << 63n), 0n, 'CV burrow success bit missing');
            assert.strictEqual(Number(burrow & 0xffff_ffffn) >>> 0, root, 'burrow changed OLOGY root');
            assert.strictEqual(Number((burrow >> 32n) & 0x7fff_ffffn), 81, 'burrow depth mismatch');
            assert.strictEqual(BigInt(e.i13_corpus_burrow(root, 81, 81, 0)), 0n, 'authority-off burrow must veto');
            console.log(`BROWSER WASM PASS · Sonia -> Fractint hops=${hops} · z=81 CV PASS · authority VETO PASS`);
          })().catch(error => { console.error(error); process.exit(1); });
          NODE
      - name: Execute Stage 14.3 JavaScript self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage14-corpus-navigator.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {}, getElementById() { return null; } },
            console, Map, Set, Object, Math, JSON, Error, Uint8Array, BigInt, WebAssembly,
            atob: value => Buffer.from(value, 'base64').toString('binary'),
            setTimeout, clearTimeout
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13CorpusNavigatorStage.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          assert.strictEqual(result.checks.length, 7);
          console.log(`STAGE 14.3 JS PASS · checks=${result.checks.length}`);
          NODE
      - name: Commit generated Pages assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/assets/corpus-browser.json docs/assets/i13_h1_1.wasm.b64
          if git diff --cached --quiet; then
            echo "generated Pages assets already current"
            exit 0
          fi
          git commit -m "stage14.3: publish browser corpus assets"
          git pull --rebase origin main
          git push origin HEAD:main
