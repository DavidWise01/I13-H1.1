name: Stage 11 VH1

on:
  push:
    branches: [main]
    paths:
      - 'docs/stages/stage11-vh1.js'
      - 'docs/STAGE11-VH1.md'
      - 'docs/index.html'
      - 'reference/vh1/**'
      - 'src/**'
      - '.github/workflows/stage11-vh1.yml'
  pull_request:
    paths:
      - 'docs/stages/stage11-vh1.js'
      - 'docs/STAGE11-VH1.md'
      - 'docs/index.html'
      - 'reference/vh1/**'
      - 'src/**'
      - '.github/workflows/stage11-vh1.yml'

permissions:
  contents: read

jobs:
  vh1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check Stage 11 JavaScript syntax
        run: node --check docs/stages/stage11-vh1.js

      - name: Check Stage 11 mount contract
        run: |
          grep -q "const MODULE_ID = 'vh1'" docs/stages/stage11-vh1.js
          grep -q "const BASE = 3" docs/stages/stage11-vh1.js
          grep -q "const MAX_DEPTH = 4" docs/stages/stage11-vh1.js
          grep -q "title: 'VH1 · FROZEN TERNARY WIDTH / HAMILTONIAN · EXPLODED'" docs/stages/stage11-vh1.js
          grep -q "family: 'la'" docs/stages/stage11-vh1.js
          grep -q 'expanded: false' docs/stages/stage11-vh1.js
          grep -q 'machineExpanded: false' docs/stages/stage11-vh1.js
          grep -q "label: 'RESET'" docs/stages/stage11-vh1.js
          grep -q "label: 'DEPTH -'" docs/stages/stage11-vh1.js
          grep -q "label: 'DEPTH +'" docs/stages/stage11-vh1.js
          grep -q "label: 'APPLY H'" docs/stages/stage11-vh1.js
          grep -q "label: 'RECEIPT'" docs/stages/stage11-vh1.js
          grep -q 'stage11-vh1-output-clip' docs/stages/stage11-vh1.js
          grep -q "s.src = 'stages/stage11-vh1.js'" docs/index.html

      - name: Execute Stage 11 VH1 self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage11-vh1.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {} },
            console, Object, Math, JSON, Error, Number, Array
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13VH1Stage.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          const checks = Object.fromEntries(result.checks.map(c => [c.name, c.pass]));
          assert.strictEqual(checks['base is ternary'], true);
          assert.strictEqual(checks['depth bound is 0..4'], true);
          assert.strictEqual(checks['width ladder preserved'], true);
          assert.strictEqual(checks['max width is 81'], true);
          assert.strictEqual(checks['machine tuple preserved'], true);
          assert.strictEqual(checks['factored local shape preserved'], true);
          assert.strictEqual(checks['factored pair shape preserved'], true);
          assert.strictEqual(checks['reference demo expectation deterministic'], true);
          assert.deepStrictEqual(Array.from(result.widths), [1,3,9,27,81]);
          assert(Math.abs(result.expectation4 - (-2.2)) < 1e-12);
          NODE

      - name: Run frozen VH1 reference demo
        run: |
          python reference/vh1/vh1.py | tee /tmp/vh1-demo.txt
          grep -q 'VH1 depth=4 width=81 H=81x81 factored=True terminated=True' /tmp/vh1-demo.txt

      - name: Check preserved VH1 manifest
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('corpus/i13-corpus/i13-august-15/I13_VH1_FROZEN/VH1-MANIFEST.json')
          data = json.loads(p.read_text())
          assert data['freeze'] == 'VH1'
          assert data['status'] == 'FROZEN'
          assert data['tests'] == {'passed': 10, 'total': 10, 'pass': True}
          PY

      - name: Keep later stages unmounted
        run: |
          ! grep -Fq "I13Exploded.mount('vh2'" docs/stages/stage11-vh1.js
          ! grep -Fq "I13Exploded.mount('freeze'" docs/stages/stage11-vh1.js
          ! grep -Fq "I13Exploded.mount('corpus'" docs/stages/stage11-vh1.js
          ! grep -Fq "I13Exploded.mount('ology'" docs/stages/stage11-vh1.js
