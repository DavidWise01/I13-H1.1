name: I13 Terminal-Bench 2.1 one-task smoke

on:
  push:
    branches: [main]
    paths:
      - 'bench/i13_harbor_agent.py'
      - '.github/workflows/benchmark-tbench-one.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  terminal-bench-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Publish pending benchmark status
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'pending',context:'i13/tbench-one',description:'Terminal-Bench 2.1 one-task smoke running'})

      - name: Install uv and Harbor
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/uv" tool install harbor
          "$HOME/.local/bin/harbor" --help >/dev/null
          docker version

      - name: Sanity-check I13 Harbor adapter
        run: |
          python -m py_compile bench/i13_harbor_agent.py
          python - <<'PY'
          import sys, types
          base=types.ModuleType('harbor.agents.base')
          class BaseAgent: pass
          base.BaseAgent=BaseAgent
          agents=types.ModuleType('harbor.agents')
          harbor=types.ModuleType('harbor')
          sys.modules['harbor']=harbor
          sys.modules['harbor.agents']=agents
          sys.modules['harbor.agents.base']=base
          from bench.i13_harbor_agent import _parse
          instruction='''Generate a 2048-bit RSA private key /app/ssl/server.key. Valid for 365 days. Organization Name: "DevOps Team". Common Name: "dev-internal.company.local". Save certificate /app/ssl/server.crt, combined /app/ssl/server.pem, report /app/ssl/verification.txt, checker /app/check_cert.py.'''
          spec=_parse(instruction)
          assert spec and spec['bits']==2048 and spec['days']==365 and spec['cn']=='dev-internal.company.local'
          print('I13_TBENCH_ADAPTER_PARSE_OK=1')
          PY

      - name: Prove official task environment with oracle
        run: |
          harbor run \
            -d terminal-bench/terminal-bench-2-1 \
            -a oracle \
            --include-task-name openssl-selfsigned-cert \
            -k 1 | tee /tmp/tbench-oracle.txt

      - name: Run I13 on one official Terminal-Bench 2.1 task
        run: |
          set +e
          harbor run \
            -d terminal-bench/terminal-bench-2-1 \
            --agent-import-path bench.i13_harbor_agent:I13HarborAgent \
            --include-task-name openssl-selfsigned-cert \
            -k 1 | tee /tmp/tbench-i13.txt
          harbor_code=${PIPESTATUS[0]}
          set -e
          echo "HARBOR_EXIT=$harbor_code" | tee -a /tmp/tbench-i13.txt

          python - <<'PY'
          from pathlib import Path
          import json
          roots=[Path.home()/'.harbor'/'jobs', Path('jobs')]
          rewards=[]
          for root in roots:
              if not root.exists():
                  continue
              for p in root.rglob('reward.txt'):
                  try:
                      value=float(p.read_text().strip())
                  except Exception:
                      continue
                  rewards.append((p.stat().st_mtime, value, str(p)))
          if not rewards:
              raise SystemExit('No Harbor reward.txt found')
          rewards.sort()
          mtime,value,path=rewards[-1]
          print(f'I13_TBENCH_REWARD={value}')
          print(f'I13_TBENCH_REWARD_PATH={path}')
          Path('/tmp/i13-tbench-result.json').write_text(json.dumps({
              'dataset':'terminal-bench/terminal-bench-2-1',
              'task':'openssl-selfsigned-cert',
              'reward':value,
              'reward_path':path,
          }, indent=2))
          if value < 1.0:
              raise SystemExit(f'I13 benchmark task failed with reward={value}')
          PY

      - name: Publish benchmark result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ job.status }}'==='success';
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-one',description:ok?'Terminal-Bench 2.1 task 1/1 PASS':'Terminal-Bench 2.1 one-task smoke failed'})
