name: I13 Terminal-Bench 2.1 one-task smoke

on:
  push:
    branches: [main]
    paths:
      - 'bench/**'
      - '.github/workflows/benchmark-tbench-one.yml'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  terminal-bench-one:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Publish pending benchmark statuses
        if: ${{ github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            for (const [statusContext, description] of [
              ['i13/tbench-install','Harbor install pending'],
              ['i13/tbench-cli','Harbor CLI pending'],
              ['i13/tbench-docker','Docker daemon pending'],
              ['i13/tbench-oracle','official task oracle pending'],
              ['i13/tbench-agent','I13 official task run pending'],
              ['i13/tbench-one','Terminal-Bench 2.1 one-task smoke pending'],
            ]) await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:'pending',context:statusContext,description,target_url});

      - name: Install Harbor
        id: install
        continue-on-error: true
        run: |
          python -m pip install --upgrade pip
          python -m pip install harbor
          python -m py_compile bench/i13_harbor_agent.py

      - name: Publish Harbor install result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ steps.install.outcome }}'==='success';
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-install',description:ok?'current Harbor installed':'Harbor pip install failed',target_url});

      - name: Verify Harbor CLI
        id: cli
        if: ${{ steps.install.outcome == 'success' }}
        continue-on-error: true
        run: |
          harbor --version || harbor --help
          harbor run --help >/dev/null

      - name: Publish Harbor CLI result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ steps.cli.outcome }}'==='success';
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-cli',description:ok?'Harbor CLI ready':'Harbor CLI failed',target_url});

      - name: Verify Docker daemon
        id: docker
        continue-on-error: true
        run: |
          docker version
          docker info >/dev/null
          docker run --rm hello-world >/dev/null

      - name: Publish Docker result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ steps.docker.outcome }}'==='success';
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-docker',description:ok?'Docker daemon ready':'Docker daemon unavailable',target_url});

      - name: Sanity-check real Harbor agent import and parser
        if: ${{ steps.install.outcome == 'success' }}
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python - <<'PY'
          from bench.i13_harbor_agent import I13HarborAgent, _parse
          assert I13HarborAgent.name() == 'i13-harbor-openssl-v0.1'
          instruction='''Generate a 2048-bit RSA private key /app/ssl/server.key. Valid for 365 days. Organization Name: "DevOps Team". Common Name: "dev-internal.company.local". Save certificate /app/ssl/server.crt, combined /app/ssl/server.pem, report /app/ssl/verification.txt, checker /app/check_cert.py.'''
          spec=_parse(instruction)
          assert spec and spec['bits']==2048 and spec['days']==365 and spec['cn']=='dev-internal.company.local'
          print('I13_TBENCH_ADAPTER_IMPORT_OK=1')
          PY

      - name: Prove official task environment with oracle
        id: oracle
        if: ${{ steps.install.outcome == 'success' && steps.cli.outcome == 'success' && steps.docker.outcome == 'success' }}
        continue-on-error: true
        run: |
          set -euo pipefail
          rm -rf /tmp/i13-tbench-oracle
          mkdir -p /tmp/i13-tbench-oracle
          cd /tmp/i13-tbench-oracle
          harbor run \
            -t terminal-bench/openssl-selfsigned-cert \
            -a oracle \
            -k 1 \
            -y | tee oracle.txt
          python - <<'PY'
          from pathlib import Path
          rewards=list(Path('jobs').rglob('reward.txt'))
          if len(rewards) != 1:
              raise SystemExit(f'expected exactly one oracle reward, found {len(rewards)}')
          value=float(rewards[0].read_text().strip())
          print(f'ORACLE_TBENCH_REWARD={value}')
          if value != 1.0:
              raise SystemExit(f'official oracle reward={value}')
          PY

      - name: Publish oracle result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ steps.oracle.outcome }}'==='success';
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-oracle',description:ok?'official openssl task oracle reward 1.0':'official task oracle failed',target_url});

      - name: Run I13 on one official Terminal-Bench 2.1 task
        id: agent
        if: ${{ steps.oracle.outcome == 'success' }}
        continue-on-error: true
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          rm -rf /tmp/i13-tbench-agent
          mkdir -p /tmp/i13-tbench-agent
          cd /tmp/i13-tbench-agent
          harbor run \
            -t terminal-bench/openssl-selfsigned-cert \
            --agent bench.i13_harbor_agent:I13HarborAgent \
            -k 1 \
            -y | tee agent.txt

          python - <<'PY'
          from pathlib import Path
          rewards=list(Path('jobs').rglob('reward.txt'))
          if len(rewards) != 1:
              raise SystemExit(f'expected exactly one I13 reward, found {len(rewards)}')
          value=float(rewards[0].read_text().strip())
          print(f'I13_TBENCH_REWARD={value}')
          print(f'I13_TBENCH_REWARD_PATH={rewards[0]}')
          if value != 1.0:
              raise SystemExit(f'I13 benchmark reward={value}')
          PY
          grep -Fq '1/1 Mean: 1.000' agent.txt

      - name: Publish I13 agent result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ steps.agent.outcome }}'==='success';
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-agent',description:ok?'I13 isolated Terminal-Bench reward 1.0':'I13 official task failed',target_url});

      - name: Enforce complete benchmark pass
        id: final
        run: |
          test '${{ steps.install.outcome }}' = success
          test '${{ steps.cli.outcome }}' = success
          test '${{ steps.docker.outcome }}' = success
          test '${{ steps.oracle.outcome }}' = success
          test '${{ steps.agent.outcome }}' = success

      - name: Publish benchmark result
        if: ${{ always() && github.event_name == 'push' }}
        uses: actions/github-script@v7
        with:
          script: |
            const ok='${{ steps.final.outcome }}'==='success';
            const target_url=`https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.repos.createCommitStatus({owner:context.repo.owner,repo:context.repo.repo,sha:context.sha,state:ok?'success':'failure',context:'i13/tbench-one',description:ok?'Terminal-Bench 2.1 official task 1/1 PASS':'Terminal-Bench 2.1 one-task smoke failed',target_url});
