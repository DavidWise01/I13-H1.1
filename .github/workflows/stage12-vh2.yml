name: Stage 12 VH2

on:
  push:
    branches: [main]
    paths:
      - 'docs/stages/stage12-vh2-cubi.js'
      - 'docs/STAGE12-VH2-CUBI.md'
      - 'docs/index.html'
      - 'reference/vh2/**'
      - 'scripts/stage12_vh2_erasure_check.py'
      - '.github/workflows/stage12-vh2.yml'
  pull_request:
    paths:
      - 'docs/stages/stage12-vh2-cubi.js'
      - 'docs/STAGE12-VH2-CUBI.md'
      - 'docs/index.html'
      - 'reference/vh2/**'
      - 'scripts/stage12_vh2_erasure_check.py'
      - '.github/workflows/stage12-vh2.yml'

permissions:
  contents: read

jobs:
  vh2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install reference dependency
        run: python -m pip install numpy

      - name: Check Stage 12 JavaScript syntax
        run: node --check docs/stages/stage12-vh2-cubi.js

      - name: Check Stage 12 mount contract
        run: |
          grep -q "const MODULE_ID = 'vh2'" docs/stages/stage12-vh2-cubi.js
          grep -q "const PHYSICAL_QUBITS = 5" docs/stages/stage12-vh2-cubi.js
          grep -q "const DISTANCE = 3" docs/stages/stage12-vh2-cubi.js
          grep -q "title: 'VH2 · CUBI \[\[5,1,3\]\] · EXPLODED'" docs/stages/stage12-vh2-cubi.js
          grep -q "family: 'qec'" docs/stages/stage12-vh2-cubi.js
          grep -q 'expanded: false' docs/stages/stage12-vh2-cubi.js
          grep -q 'machineExpanded: false' docs/stages/stage12-vh2-cubi.js
          grep -q "label: 'RESET'" docs/stages/stage12-vh2-cubi.js
          grep -q "label: 'ERROR +'" docs/stages/stage12-vh2-cubi.js
          grep -q "label: 'SYNDROME'" docs/stages/stage12-vh2-cubi.js
          grep -q "label: 'RECOVER'" docs/stages/stage12-vh2-cubi.js
          grep -q "label: 'MODE'" docs/stages/stage12-vh2-cubi.js
          grep -q 'stage12-vh2-output-clip' docs/stages/stage12-vh2-cubi.js
          grep -q "s2.src = 'stages/stage12-vh2-cubi.js'" docs/index.html
          grep -q 'data-family="qec"' docs/index.html

      - name: Execute Stage 12 VH2 JavaScript self-test
        run: |
          node <<'NODE'
          const fs = require('fs');
          const vm = require('vm');
          const assert = require('assert');
          const source = fs.readFileSync('docs/stages/stage12-vh2-cubi.js', 'utf8');
          const sandbox = {
            window: {},
            document: { readyState: 'loading', addEventListener() {} },
            console, Map, Set, Object, Math, JSON, Error, Number, Array
          };
          vm.createContext(sandbox);
          vm.runInContext(source, sandbox);
          const result = sandbox.window.I13VH2Stage.selfTest();
          assert.strictEqual(result.pass, true, JSON.stringify(result));
          const checks = Object.fromEntries(result.checks.map(c => [c.name, c.pass]));
          assert.strictEqual(checks['five physical qubits'], true);
          assert.strictEqual(checks['one logical qubit distance three'], true);
          assert.strictEqual(checks['code space rank is two'], true);
          assert.strictEqual(checks['stabilizer generators preserved'], true);
          assert.strictEqual(checks['logical operators preserved'], true);
          assert.strictEqual(checks['15 physical single-Pauli errors'], true);
          assert.strictEqual(checks['15 syndromes unique'], true);
          assert.strictEqual(checks['all single-Pauli syndromes nonzero'], true);
          assert.strictEqual(checks['syndrome map decodes every single-Pauli error'], true);
          assert.strictEqual(checks['ternary controller remains external metadata/control'], true);
          assert.strictEqual(checks['ternary quantum basis rejected by rank'], true);
          assert.strictEqual(checks['odd-width project overlay is 2|3'], true);
          assert.strictEqual(result.errors, 15);
          assert.strictEqual(new Set(Array.from(result.syndromes)).size, 15);
          NODE

      - name: Run preserved VH2 hypothesis test
        run: |
          python reference/vh2/vh2_cubi_test.py > /tmp/vh2.json
          python - <<'PY'
          import json
          data = json.load(open('/tmp/vh2.json'))
          assert data['pass'] is True
          assert data['passed'] == 10
          assert data['total'] == 10
          assert data['details']['physical_qubits'] == 5
          assert data['details']['logical_qubits'] == 1
          assert data['details']['code_distance'] == 3
          assert data['details']['code_space_dimension'] == 2
          assert data['details']['ternary_controller_modes'] == 3
          PY

      - name: Verify all two-qubit erasure subsets
        run: |
          python scripts/stage12_vh2_erasure_check.py | tee /tmp/vh2-erasure.txt
          grep -q 'TOTAL: 10/10 PASS' /tmp/vh2-erasure.txt

      - name: Preserve source interpretation boundary
        run: |
          grep -q 'PASSING MODEL: ternary controller above one \[\[5,1,3\]\] protected logical qubit' reference/vh2/VH2-CUBI-TEST-REPORT.txt
          grep -q 'REJECTED MODEL: ternary quantum logical basis inside the same \[\[5,1,3\]\] block' reference/vh2/VH2-CUBI-TEST-REPORT.txt
          grep -q 'project topology overlay, not stabilizer partition' docs/stages/stage12-vh2-cubi.js
          grep -q 'physical quantum hardware · NOT CLAIMED' docs/stages/stage12-vh2-cubi.js

      - name: Keep later stages unmounted
        run: |
          ! grep -Fq "I13Exploded.mount('freeze'" docs/stages/stage12-vh2-cubi.js
          ! grep -Fq "I13Exploded.mount('corpus'" docs/stages/stage12-vh2-cubi.js
          ! grep -Fq "I13Exploded.mount('ology'" docs/stages/stage12-vh2-cubi.js
