<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>I13 · Icarium H1.1</title>
<style>
:root{color-scheme:light;background:#f5f8fb}

<object id="i13" data="i13.svg" type="image/svg+xml" aria-label="I13 H1.1 trunk">

<script>
(() => {
  const object = document.getElementById('i13');
  const SVG_NS = 'http://www.w3.org/2000/svg';

  const palette = `
:root{
  --paper:#f5f8fb;
  --panel:#ffffff;
  --ink:#18212b;
  --muted:#64748b;
  --line:#94a3b8;
  --line-strong:#475569;
  --root:#334155;
  --designate:#0891b2;
  --designate-bg:#ecfeff;
  --bind:#059669;
  --bind-bg:#ecfdf5;
  --decide:#7c3aed;
  --decide-bg:#f5f3ff;
  --transform:#d97706;
  --transform-bg:#fffbeb;
  --i13:#0e7490;
  --i13-bg:#ecfeff;
  --python:#ca8a04;
  --python-bg:#fefce8;
  --wasm:#2563eb;
  --wasm-bg:#eff6ff;
  --gpu:#c026d3;
  --gpu-bg:#fdf4ff;
  --cortex:#be123c;
  --cortex-bg:#fff1f2;
  --pulse:#ea580c;
  --pulse-bg:#fff7ed;
  --la:#0f766e;
  --la-bg:#f0fdfa;
  --qec:#6d28d9;
  --qec-bg:#f5f3ff;
  --freeze:#64748b;
  --freeze-bg:#f8fafc;
  --corpus:#0d9488;
  --corpus-bg:#f0fdfa;
  --live:#16a34a;
  --live-bg:#f0fdf4;
  --pass:#16a34a;
  --veto:#dc2626;
  --running:#d97706;
}
text{fill:var(--ink)}
.muted{fill:var(--muted)}
.line{stroke:var(--line-strong)}
.soft{stroke:var(--line)}
.box{fill:var(--panel);stroke:var(--line-strong)}
.node{fill:var(--panel);stroke:var(--line-strong)}
.tag{fill:#f8fafc;stroke:var(--line)}
.axis{stroke:var(--line-strong)}
.hot{fill:#ffffff;stroke:#64748b;transition:fill .14s ease,stroke .14s ease}
.hot:hover{fill:#eef6ff;stroke:var(--wasm)}
.voxel{stroke:var(--wasm);fill:#eff6ff;fill-opacity:.42}
.queen{fill:var(--cortex)}
#root > circle.node{fill:var(--root);stroke:var(--root)}
#root > circle.node + text{fill:#ffffff}
#root > .title{fill:#0f172a}
#words > rect:nth-of-type(-n+3){fill:var(--designate-bg);stroke:var(--designate)}
#words > rect:nth-of-type(n+4):nth-of-type(-n+6){fill:var(--bind-bg);stroke:var(--bind)}
#words > rect:nth-of-type(n+7):nth-of-type(-n+9){fill:var(--decide-bg);stroke:var(--decide)}
#words > rect:nth-of-type(n+10):nth-of-type(-n+12){fill:var(--transform-bg);stroke:var(--transform)}
#words > text:nth-of-type(1){fill:var(--designate)}
#words > text:nth-of-type(5){fill:var(--bind)}
#words > text:nth-of-type(9){fill:var(--decide)}
#words > text:nth-of-type(13){fill:var(--transform)}
#module-layer [data-module="reader"] .box,#module-layer [data-module="norm"] .box{fill:var(--i13-bg);stroke:var(--i13)}
#module-layer [data-module="reader"] circle,#module-layer [data-module="norm"] circle{fill:var(--i13);stroke:var(--i13)}
#module-layer [data-module="python"] .box,#module-layer [data-module="jit"] .box{fill:var(--python-bg);stroke:var(--python)}
#module-layer [data-module="python"] circle,#module-layer [data-module="jit"] circle{fill:var(--python);stroke:var(--python)}
#module-layer [data-module="wasm1"] .box,#module-layer [data-module="wasm2"] .box{fill:var(--wasm-bg);stroke:var(--wasm)}
#module-layer [data-module="wasm1"] circle,#module-layer [data-module="wasm2"] circle{fill:var(--wasm);stroke:var(--wasm)}
#module-layer [data-module="gfx"] .box{fill:var(--gpu-bg);stroke:var(--gpu)}
#module-layer [data-module="gfx"] circle{fill:var(--gpu);stroke:var(--gpu)}
#module-layer [data-module="child"] .box{fill:var(--cortex-bg);stroke:var(--cortex)}
#module-layer [data-module="child"] circle{fill:var(--cortex);stroke:var(--cortex)}
#module-layer [data-module="pulse"] .box{fill:var(--pulse-bg);stroke:var(--pulse)}
#module-layer [data-module="pulse"] circle{fill:var(--pulse);stroke:var(--pulse)}
#module-layer [data-module="vh1"] .box{fill:var(--la-bg);stroke:var(--la)}
#module-layer [data-module="vh1"] circle{fill:var(--la);stroke:var(--la)}
#module-layer [data-module="vh2"] .box{fill:var(--qec-bg);stroke:var(--qec)}
#module-layer [data-module="vh2"] circle{fill:var(--qec);stroke:var(--qec)}
#module-layer [data-module="freeze"] .box{fill:var(--freeze-bg);stroke:var(--freeze)}
#module-layer [data-module="freeze"] circle{fill:var(--freeze);stroke:var(--freeze)}
#module-layer [data-module="corpus"] .box{fill:var(--corpus-bg);stroke:var(--corpus)}
#module-layer [data-module="corpus"] circle{fill:var(--corpus);stroke:var(--corpus)}
#module-layer [data-module="ology"] .box{fill:var(--live-bg);stroke:var(--live);stroke-width:2.2}
#module-layer [data-module="ology"] circle{fill:var(--live);stroke:var(--live)}
#module-layer [data-module="reader"] .tag,#module-layer [data-module="norm"] .tag{fill:var(--i13-bg);stroke:var(--i13)}
#module-layer [data-module="python"] .tag,#module-layer [data-module="jit"] .tag{fill:var(--python-bg);stroke:var(--python)}
#module-layer [data-module="wasm1"] .tag,#module-layer [data-module="wasm2"] .tag{fill:var(--wasm-bg);stroke:var(--wasm)}
#module-layer [data-module="gfx"] .tag{fill:var(--gpu-bg);stroke:var(--gpu)}
#module-layer [data-module="child"] .tag{fill:var(--cortex-bg);stroke:var(--cortex)}
#module-layer [data-module="pulse"] .tag{fill:var(--pulse-bg);stroke:var(--pulse)}
#module-layer [data-module="vh1"] .tag{fill:var(--la-bg);stroke:var(--la)}
#module-layer [data-module="vh2"] .tag{fill:var(--qec-bg);stroke:var(--qec)}
#module-layer [data-module="freeze"] .tag{fill:var(--freeze-bg);stroke:var(--freeze)}
#module-layer [data-module="corpus"] .tag{fill:var(--corpus-bg);stroke:var(--corpus)}
#module-layer [data-module="ology"] .tag{fill:var(--live-bg);stroke:var(--live)}
.i13-exploded-panel[data-family="la"] .ev-shell{stroke:var(--la,#0f766e)}
.i13-exploded-panel[data-family="qec"] .ev-shell{stroke:var(--qec,#6d28d9)}
.i13-exploded-panel[data-family="freeze"] .ev-shell{stroke:var(--freeze,#64748b)}
#lab > line.line{stroke:var(--live);stroke-width:2.5}
#lab > .module-title{fill:var(--live)}
#lab > g:nth-of-type(1) > .box{fill:#f8fbff;stroke:var(--wasm)}
#lab > g:nth-of-type(2) > .box{fill:#fff8fb;stroke:var(--cortex)}
#lab #queen{fill:var(--cortex)}
#lab #depth-dot{fill:var(--live)}
#lab #cv-label{fill:var(--cortex);font-weight:700}
#lab #runtime{fill:var(--wasm);font-weight:700}
#lab #py-runtime{fill:var(--python);font-weight:700}
#lab #authority-text{fill:var(--cortex);font-weight:700}
`;
  function applyColorSystem() {
    const doc = object.contentDocument;
    if (!doc || !doc.documentElement) return;
    const old = doc.getElementById('i13-color-system');
    if (old) old.remove();
    const style = doc.createElementNS(SVG_NS, 'style');
    style.id = 'i13-color-system';
    style.textContent = palette;
    doc.documentElement.appendChild(style);
  }
  object.addEventListener('load', applyColorSystem);
})();
</script>
