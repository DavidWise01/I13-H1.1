<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#09060a">
  <title>Icarium · I13</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <canvas id="inferno" aria-hidden="true"></canvas>

  <main class="stage" aria-label="Icarium I13 machine">
    <section class="machine-shell" aria-label="I13 radial layout">
      <div class="machine-glow" aria-hidden="true"></div>
      <div class="rings" aria-hidden="true">
        <span class="ring ring-1"></span>
        <span class="ring ring-2"></span>
        <span class="ring ring-3"></span>
        <span class="ring ring-4"></span>
        <span class="ring ring-5"></span>
        <span class="ring ring-6"></span>
        <span class="ring ring-7"></span>
        <span class="ring ring-8"></span>
        <span class="ring ring-9"></span>
      </div>

      <div class="core core-center" data-word="I" data-group="seed">I</div>

      <button class="word" data-word="Name" data-group="designate">Name</button>
      <button class="word" data-word="Constant" data-group="designate">Constant</button>
      <button class="word" data-word="Attribute" data-group="designate">Attribute</button>

      <button class="word" data-word="Assign" data-group="bind">Assign</button>
      <button class="word" data-word="Arg" data-group="bind">Arg</button>
      <button class="word" data-word="Return" data-group="bind">Return</button>

      <button class="word" data-word="Expr" data-group="decide">Expr</button>
      <button class="word" data-word="If" data-group="decide">If</button>
      <button class="word" data-word="Compare" data-group="decide">Compare</button>

      <button class="word" data-word="Call" data-group="transform">Call</button>
      <button class="word" data-word="FunctionDef" data-group="transform">FunctionDef</button>
      <button class="word" data-word="BinOp" data-group="transform">BinOp</button>

      <svg class="links" viewBox="0 0 1000 1000" preserveAspectRatio="none" aria-hidden="true">
        <g id="link-layer"></g>
      </svg>

      <div class="machine-status" aria-hidden="true">
        <div class="status-dot"></div>
        <div class="status-line"></div>
        <div class="status-dot warm"></div>
      </div>
    </section>
  </main>

  <script src="assets/app.js" defer></script>
</body>
</html>
