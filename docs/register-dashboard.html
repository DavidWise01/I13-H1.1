<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111827"><title>I13 · Register Dashboard 0x0–0x7</title>
<style>
:root{color-scheme:dark;--bg:#0b1018;--panel:#111927;--line:#29364a;--blue:#55b8ff;--green:#54d68b;--amber:#f7c65c;--red:#ff7185;--ink:#edf5ff;--muted:#8fa1b7}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,system-ui,sans-serif}nav,main,footer{max-width:1240px;margin:auto}nav{height:64px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);font:12px ui-monospace,monospace}a{color:var(--blue);text-decoration:none}header{padding:38px 0 25px;display:flex;justify-content:space-between;align-items:end;gap:20px}h1{font-size:34px;margin:0}header p{margin:7px 0 0;color:var(--muted)}.status{font:12px ui-monospace,monospace;color:var(--green)}.toolbar,.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px}.toolbar{padding:12px;display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}button,select,input,textarea{background:#0a111c;border:1px solid var(--line);border-radius:7px;color:var(--ink);padding:9px 11px;font:12px ui-monospace,monospace}button{cursor:pointer}button:hover{border-color:var(--blue)}button.primary{background:#123c5b;border-color:#347bae}button.danger{color:var(--red)}.registers{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.reg{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;transition:.15s}.reg.selected{border-color:var(--blue);box-shadow:0 0 0 2px #55b8ff16}.reghead{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.addr{font:800 20px ui-monospace,monospace;color:var(--blue)}.role{font:10px ui-monospace,monospace;color:var(--muted)}.bits{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}.bit{padding:12px 3px;border:1px solid var(--line);border-radius:7px;text-align:center;font:700 15px ui-monospace,monospace;cursor:pointer;background:#0a111c}.bit.on{background:#174d38;border-color:var(--green);color:#afffd0}.bit small{display:block;font-size:8px;color:var(--muted);margin-top:3px}.values{display:grid;grid-template-columns:1fr 1fr 2fr;gap:8px;margin-top:12px}.values label,.opgrid label{display:grid;gap:4px;color:var(--muted);font:9px ui-monospace,monospace}.values input{width:100%}.lower{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}.panel{padding:18px}.panel h2{font-size:15px;margin:0 0 14px}.opgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.opgrid button{align-self:end}.history{height:250px;overflow:auto;font:11px/1.65 ui-monospace,monospace}.entry{padding:5px 0;border-bottom:1px solid #ffffff0a;color:#b8c8da}.entry b{color:var(--amber)}textarea{width:100%;height:130px;resize:vertical}.map{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;margin-top:15px}.cell{height:42px;display:grid;place-items:center;background:#0a111c;border:1px solid var(--line);border-radius:6px;font:11px ui-monospace,monospace}.cell.live{background:#174d38;border-color:var(--green)}footer{padding:26px 0 45px;color:var(--muted);font:10px ui-monospace,monospace}@media(max-width:800px){nav,main,footer{margin-inline:13px}.registers,.lower{grid-template-columns:1fr}.values,.opgrid{grid-template-columns:1fr}.bits{gap:3px}.bit{padding:10px 1px}.map{grid-template-columns:repeat(4,1fr)}header{align-items:start;flex-direction:column}}
</style></head><body><nav><a href="zero-point-seed.html">← ZERO-POINT SEED</a><span>REGISTER BUS / 8 × 8-BIT</span></nav><main>
<header><div><h1>Register Dashboard</h1><p>Direct GUI control of byte registers <code>0x0</code> through <code>0x7</code>.</p></div><div class="status" id="receipt">RECEIPT / —</div></header>
<section class="toolbar"><button class="primary" id="reset">RESET</button><button id="zero">ZERO ALL</button><button id="ones">SET ALL</button><button id="random">RANDOMIZE</button><button id="step">STEP +1</button><button id="undo">UNDO</button><button id="export">EXPORT JSON</button><button id="import">IMPORT JSON</button></section>
<section class="registers" id="registers"></section>
<div class="lower"><section class="panel"><h2>Selected-register operations</h2><div class="opgrid"><button id="invert">NOT</button><button id="shl">SHIFT LEFT</button><button id="shr">SHIFT RIGHT</button><button id="rol">ROTATE LEFT</button><button id="ror">ROTATE RIGHT</button><button id="inc">INCREMENT</button><button id="dec">DECREMENT</button><label>XOR MASK<input id="mask" value="0x0F"></label><button id="xor">APPLY XOR</button><label>SOURCE<select id="source"></select></label><label>DESTINATION<select id="destination"></select></label><button id="copy">COPY</button><button id="swap">SWAP</button></div><h2 style="margin-top:22px">Bus activity</h2><div class="map" id="map"></div></section>
<section class="panel"><h2>Witness history</h2><div class="history" id="history"></div><h2 style="margin-top:18px">Import/export buffer</h2><textarea id="buffer" spellcheck="false" placeholder='{"registers":[0,0,0,0,0,0,0,0]}'></textarea></section></div>
</main><footer>REGISTER DASHBOARD v1.0 · VALUES CLAMPED TO UNSIGNED 8-BIT · 0x0–0x7</footer>
<script>
const roles=['NORTH','SOUTH','EAST','WEST','AXIS X','AXIS Y','AXIS Z','SEED / VERIFY'],initial=[0x60,0x40,0x60,0x40,0x04,0x06,0x04,0x06],$=s=>document.querySelector(s);let regs=[...initial],selected=0,history=[],snapshots=[];function clamp(v){return(Number(v)||0)&255}function hash(s){let h=2166136261;for(const c of s){h^=c.codePointAt(0);h=Math.imul(h,16777619)}return(h>>>0).toString(16).padStart(8,'0')}function record(op,before=[...regs]){snapshots.push(before);snapshots=snapshots.slice(-100);history.unshift({op,state:[...regs]});history=history.slice(0,100);render()}function setReg(i,v,op){const before=[...regs];regs[i]=clamp(v);record(op,before)}function render(){const root=$('#registers');root.innerHTML=regs.map((v,i)=>'<article class="reg '+(i===selected?'selected':'')+'" data-i="'+i+'"><div class="reghead"><span class="addr">0x'+i.toString(16).toUpperCase()+'</span><span class="role">'+roles[i]+'</span></div><div class="bits">'+[7,6,5,4,3,2,1,0].map(b=>'<span class="bit '+((v>>b)&1?'on':'')+'" data-bit="'+b+'">'+((v>>b)&1)+'<small>b'+b+'</small></span>').join('')+'</div><div class="values"><label>HEX<input data-type="hex" value="0x'+v.toString(16).toUpperCase().padStart(2,'0')+'"></label><label>DEC<input data-type="dec" value="'+v+'"></label><label>BINARY<input data-type="bin" value="'+v.toString(2).padStart(8,'0')+'"></label></div></article>').join('');$('#map').innerHTML=regs.map((v,i)=>'<div class="cell '+(v?'live':'')+'">0x'+i.toString(16).toUpperCase()+'<br>'+v.toString(16).toUpperCase().padStart(2,'0')+'</div>').join('');$('#history').innerHTML=history.map((h,i)=>'<div class="entry"><b>'+String(history.length-i).padStart(3,'0')+'</b> '+h.op+' · '+h.state.map(v=>v.toString(16).padStart(2,'0')).join(' ')+'</div>').join('');$('#receipt').textContent='RECEIPT / '+hash(JSON.stringify(regs))}$('#registers').onclick=e=>{const reg=e.target.closest('.reg');if(!reg)return;selected=+reg.dataset.i;if(e.target.classList.contains('bit'))setReg(selected,regs[selected]^(1<<+e.target.dataset.bit),'TOGGLE 0x'+selected.toString(16)+'.b'+e.target.dataset.bit);else render()};$('#registers').onchange=e=>{const reg=e.target.closest('.reg');if(!reg||!e.target.dataset.type)return;const i=+reg.dataset.i,t=e.target.dataset.type,v=parseInt(e.target.value,t==='hex'?16:t==='bin'?2:10);selected=i;setReg(i,v,'EDIT '+t.toUpperCase()+' 0x'+i.toString(16))};function op(name,fn){const b=[...regs];regs[selected]=clamp(fn(regs[selected]));record(name+' 0x'+selected.toString(16),b)}$('#invert').onclick=()=>op('NOT',v=>~v);$('#shl').onclick=()=>op('SHL',v=>v<<1);$('#shr').onclick=()=>op('SHR',v=>v>>>1);$('#rol').onclick=()=>op('ROL',v=>(v<<1)|(v>>>7));$('#ror').onclick=()=>op('ROR',v=>(v>>>1)|(v<<7));$('#inc').onclick=()=>op('INC',v=>v+1);$('#dec').onclick=()=>op('DEC',v=>v-1);$('#xor').onclick=()=>op('XOR',v=>v^parseInt($('#mask').value.replace(/^0x/i,''),16));function fillSelects(){const o=regs.map((_,i)=>'<option value="'+i+'">0x'+i.toString(16).toUpperCase()+' · '+roles[i]+'</option>').join('');$('#source').innerHTML=o;$('#destination').innerHTML=o;$('#destination').value=1}fillSelects();$('#copy').onclick=()=>{const s=+$('#source').value,d=+$('#destination').value,b=[...regs];regs[d]=regs[s];record('COPY 0x'+s.toString(16)+' → 0x'+d.toString(16),b)};$('#swap').onclick=()=>{const s=+$('#source').value,d=+$('#destination').value,b=[...regs];[regs[s],regs[d]]=[regs[d],regs[s]];record('SWAP 0x'+s.toString(16)+' ↔ 0x'+d.toString(16),b)};$('#reset').onclick=()=>{const b=[...regs];regs=[...initial];record('RESET',b)};$('#zero').onclick=()=>{const b=[...regs];regs.fill(0);record('ZERO ALL',b)};$('#ones').onclick=()=>{const b=[...regs];regs.fill(255);record('SET ALL',b)};$('#random').onclick=()=>{const b=[...regs];regs=regs.map(()=>Math.floor(Math.random()*256));record('RANDOMIZE',b)};$('#step').onclick=()=>{const b=[...regs],carry=regs[7]===255?1:0;for(let i=7;i>=0;i--){regs[i]=(regs[i]+1)&255;if(regs[i])break}record('BUS STEP'+(carry?' / WRAP':''),b)};$('#undo').onclick=()=>{if(!snapshots.length)return;regs=snapshots.pop();history.unshift({op:'UNDO',state:[...regs]});render()};$('#export').onclick=()=>{$('#buffer').value=JSON.stringify({format:'I13-REG8',version:1,registers:regs.map((value,address)=>({address:'0x'+address.toString(16).toUpperCase(),value,hex:'0x'+value.toString(16).toUpperCase().padStart(2,'0')}))},null,2)};$('#import').onclick=()=>{try{const j=JSON.parse($('#buffer').value),a=j.registers.map(x=>typeof x==='number'?x:x.value);if(a.length!==8)throw Error('expected 8 registers');const b=[...regs];regs=a.map(clamp);record('IMPORT JSON',b)}catch(e){alert('Import rejected: '+e.message)}};record('BOOT',[]);
</script><script>snapshots=[];</script></body></html>
