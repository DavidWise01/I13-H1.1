<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>I-13 Mesh — Ology Explorer</title>
<style>
  :root{--bg:#0a0e14;--fg:#c8d6e5;--dim:#5a6b82;--acc:#27e8a7;--amber:#ffb454;--panel:#0f1620;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 "Cascadia Code",Consolas,Menlo,monospace;}
  header{padding:12px 16px;border-bottom:1px solid #1c2735}
  h1{font-size:16px;margin:0;color:var(--acc)}
  .sub{font-size:11px;color:var(--dim);margin-top:4px}
  main{padding:14px 16px;max-width:1100px}
  .row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
  input,select{font:inherit;background:#0a0e14;color:var(--fg);border:1px solid #233044;border-radius:6px;padding:8px 10px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
  .card{background:var(--panel);border:1px solid #1c2735;border-radius:8px;padding:10px}
  .card h3{margin:0 0 4px;font-size:13px;color:var(--acc)}
  .card .meta{font-size:11px;color:var(--dim)}
  .pill{display:inline-block;font-size:10px;padding:2px 7px;border-radius:9px;margin-top:4px}
  .v{background:#10231d;color:var(--acc);border:1px solid #1d3b32}
  .c{background:#2a1410;color:#ff9d6e;border:1px solid #4a2517}
  .k{background:#2a2614;color:var(--amber);border:1px solid #4a3f1d}
  footer{font-size:11px;color:var(--dim);padding:0 16px 16px}
</style>
</head>
<body>
<header>
  <h1>&#9883; I-13 Mesh — Ology Explorer</h1>
  <div class="sub">All flayed skills, organized by TOPIC / OLOGY / LAYER / EPISTEMIC STATUS. Interactive filter.</div>
</header>
<main>
  <div class="row">
    <input id="q" placeholder="search skill…" style="flex:1;min-width:200px">
    <select id="topic"><option value="">all topics</option><option value="Python Fluency">Python Fluency</option><option value="Computational Primitives">Computational Primitives</option><option value="Security / OSINT">Security / OSINT</option><option value="Web / Frontend Patterns">Web / Frontend Patterns</option><option value="Computing History">Computing History</option><option value="CS Foundations">CS Foundations</option><option value="PL Foundations">PL Foundations</option><option value="Humanities / Classics">Humanities / Classics</option><option value="Data Science">Data Science</option><option value="Occult / Obscure">Occult / Obscure</option><option value="Esoteric Language">Esoteric Language</option><option value="Mind / Thought-Control">Mind / Thought-Control</option></select>
    <select id="status"><option value="">all statuses</option><option value="VERIFIED">VERIFIED</option><option value="CLINICAL">CLINICAL</option><option value="CONTESTED">CONTESTED</option></select>
  </div>
  <div class="grid" id="grid"></div>
</main>
<footer>Generated from the flayed corpus. VERIFIED = published/primary source; CLINICAL = clinical source; CONTESTED = disputed narrative. No external fetch.</footer>
<script>
const SKILLS = [
  {n:"think-python-downey", topic:"Python Fluency", ology:"Pedagogy / Andragogy", layer:"beginner tier", status:"VERIFIED", tool:"—", note:"Downey beginner Python (PR #10 open)"},
  {n:"automate-the-boring-stuff-sweigart", topic:"Python Fluency", ology:"Pedagogy / Andragogy", layer:"beginner tier", status:"VERIFIED", tool:"—", note:"Sweigart practical automation (merged #7)"},
  {n:"fluent-python-ramalho", topic:"Python Fluency", ology:"Pedagogy / Andragogy", layer:"advanced tier", status:"VERIFIED", tool:"—", note:"Ramalho advanced Python (merged #8)"},
  {n:"sbtcvm", topic:"Computational Primitives", ology:"Computer Architecture", layer:"computational-primitive", status:"VERIFIED", tool:"web wrapper (SSE VM)", note:"balanced-ternary 9-trit VM"},
  {n:"google-hacking-pentest", topic:"Security / OSINT", ology:"Information Security", layer:"tooling-reference", status:"VERIFIED", tool:"ghdb.py", note:"Long/Skoudis Google dorking"},
  {n:"learning-patterns", topic:"Web / Frontend Patterns", ology:"Software Design Patterns", layer:"tooling-reference", status:"VERIFIED", tool:"patterns_explorer.html", note:"Hallie/Osmani patterns.dev (JS/React)"},
  {n:"byte-magazine-first-issue", topic:"Computing History", ology:"History of Computing", layer:"cultural-myth", status:"VERIFIED", tool:"byte_reader.html", note:"BYTE Vol 00-01, Sep 1975 (first issue)"},
  {n:"retro-game-books", topic:"Computing History", ology:"History of Computing", layer:"computing-history", status:"VERIFIED", tool:"retro_catalog.html + retro_fetch.py", note:"135 retro game-dev PDFs"},
  {n:"embedded-8051", topic:"Computing History", ology:"History of Computing", layer:"computing/embedded", status:"VERIFIED", tool:"embedded_workbench.html", note:"8051 MCU + 22-book catalog (full HTML)"},
  {n:"rape-of-the-mind", topic:"Mind / Thought-Control", ology:"Clinical Psychology", layer:"cultural-myth", status:"CLINICAL", tool:"menticide_explorer.html", note:"Meerloo 1956 — menticide/brainwashing (clinical)"},
  {n:"eyes-wide-open", topic:"Mind / Thought-Control", ology:"Conspiracy Studies", layer:"cultural-myth", status:"CONTESTED", tool:"eyes_reader.html", note:"Barnett 2020 — alleged MK-ULTRA exposure (contested)"},
  {n:"data-structures-algorithms", topic:"CS Foundations", ology:"Computer Science (algorithms)", layer:"cs-foundations", status:"VERIFIED", tool:"dsa_explorer.html", note:"Karumanchi DSA Made Easy — 19-chapter reference (merged #20)"},
  {n:"fundamentals-cpp", topic:"PL Foundations", ology:"Programming Languages (C++)", layer:"pl-foundations", status:"VERIFIED", tool:"cpp_explorer.html", note:"Halterman Fundamentals of C++ — 22-chapter ref (merged #22)"},
  {n:"programming-8086", topic:"Computing History", ology:"History of Computing", layer:"computing-history", status:"VERIFIED", tool:"8086_explorer.html", note:"Coffron x86 asm (8086/8088, 1983) — 9-chapter ref (merged #24)"},
  {n:"libanius-1517", topic:"Humanities / Classics", ology:"Late-Antique Greek Rhetoric", layer:"humanities-classics", status:"VERIFIED", tool:"libanius_portal.html", note:"Libanius Greek rhetoric, 1517 ed — oldest & 1st non-technical node (merged #27)"},
  {n:"works-of-hogarth", topic:"Humanities / Classics", ology:"Art History / Satirical Prints", layer:"humanities-classics", status:"VERIFIED", tool:"hogarth_portal.html", note:"Hogarth/Trusler engravings+commentary, 1833 — 1st Art-History node (merged #29)"},
  {n:"beginning-r", topic:"Data Science", ology:"Statistics / R Programming", layer:"data-science", status:"VERIFIED", tool:"r_explorer.html", note:"Gardener Beginning R — 1st data-science/stats node (merged #32)"},
  {n:"ars-moriendi", topic:"Occult / Obscure", ology:"Deathbed Literature / Memento Mori", layer:"occult-obscure", status:"VERIFIED", tool:"ars_moriendi_explorer.html", note:"Ars Moriendi (Art of Dying), c.1415/1450 — 1st occult/obscure node (merged #34)"},

  {n:"brainfuck", topic:"Esoteric Language", ology:"Esoteric Programming Languages", layer:"esoteric-language", status:"VERIFIED", tool:"brainfuck_explorer.html", note:"Brainfuck (Urban Müller 1993) — 1st esoteric-language node (merged #36)"},

  {n:"malbolge", topic:"Esoteric Language", ology:"Esoteric Programming Languages", layer:"esoteric-language", status:"VERIFIED", tool:"malbolge_explorer.html", note:"Malbolge (Olmstead 1998) — 2nd esoteric-language node; reference-only (merged #37)"},

  {n:"p-prime-prime", topic:"Esoteric Language", ology:"Esoteric Programming Languages", layer:"esoteric-language", status:"VERIFIED", tool:"p_pp_explorer.html", note:"P'' (Bohm 1964) — capstone esolang node, parent of Brainfuck; faithful P''->BF translator (merged #39)"},

];
function render(){
  const term = document.getElementById("q").value.toLowerCase();
  const topic = document.getElementById("topic").value;
  const status = document.getElementById("status").value;
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  SKILLS.filter(s => (!term || s.n.toLowerCase().includes(term) || s.topic.toLowerCase().includes(term) || s.ology.toLowerCase().includes(term)) && (!topic || s.topic===topic) && (!status || s.status===status))
    .forEach(s => {
      const el = document.createElement("div"); el.className="card";
      const st = s.status==="VERIFIED"?"v":s.status==="CONTESTED"?"k":"c";
      el.innerHTML = `<h3>${s.n}</h3><div class="meta">${s.topic} &middot; ${s.ology}<br>${s.note}</div><span class="pill ${st}">${s.status}</span>`;
      grid.appendChild(el);
    });
}
document.getElementById("q").oninput = render;
document.getElementById("topic").onchange = render;
document.getElementById("status").onchange = render;
render();
</script>
</body>
</html>
